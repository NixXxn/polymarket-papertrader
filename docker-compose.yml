services:
  papertrader:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - papertrader-data:/data
    environment:
      SERVICE: ${SERVICE:-both}
      STRATEGY: ${STRATEGY:-both}
      PORT: "8787"
      PAPERTRADER_DATA_DIR: /data
      PAPERTRADER_MODE: ${PAPERTRADER_MODE:-paper}
      PAPERTRADER_LIVE: ${PAPERTRADER_LIVE:-0}
      PAPERTRADER_DRY_RUN: ${PAPERTRADER_DRY_RUN:-0}
      PAPERTRADER_RESET: ${PAPERTRADER_RESET:-0}
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      PAPERTRADER_PRIVATE_KEY: ${PAPERTRADER_PRIVATE_KEY:-}
      PAPERTRADER_FUNDER: ${PAPERTRADER_FUNDER:-}
      PAPERTRADER_SIGNATURE_TYPE: ${PAPERTRADER_SIGNATURE_TYPE:-1}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  papertrader-data:
