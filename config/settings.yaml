# $50 per isolated account. Combined paper start is 2 × this (safe + asymmetric).
# mode: paper (test/sim, default) or live. Live still needs --confirm-live or
# PAPERTRADER_LIVE=1 plus PAPERTRADER_PRIVATE_KEY. yaml alone cannot fire orders.
mode: paper
poll_interval_seconds: 30
horizon_days: 3
starting_balance: 500
# position_usd values are the stake at starting_balance; live bets scale with cash.
min_position_usd: 2
min_event_volume: 200
min_best_ask_size: 1
# Assumed model P(yes) ceiling for safe favorite buys (ask must be <= this).
forecast_confidence: 0.95
forecast_disagreement_f: 3.0
user_agent: "polymarket-papertrader/0.1 (paper trading; local use)"

safe:
  cities: [miami, atlanta, nyc, chicago, dallas, houston, austin, phoenix, denver, los-angeles]
  # Re-enabled: paper was -$786 @ 10% WR on 70–75¢; only near-resolution favorites.
  min_ask: 0.85
  max_ask: 0.92
  max_open_positions: 2
  min_sell_bid: 0.02
  starting_balance: 10000
  min_edge: 0.03
  min_edge_high: 0.05
  min_edge_low: 0.02
  position_usd:
    miami: 75
    atlanta: 75
    nyc: 75
    chicago: 75
    dallas: 75
    houston: 75
    austin: 75
    phoenix: 75
    denver: 75
    los-angeles: 75

# Asymmetric: cheap YES lottery (1-in-~20); hold tails to resolution, no ladder trims.
asymmetric:
  min_ask: 0.01
  max_ask: 0.20
  min_model_prob: 0.03
  min_prob_ratio: 1.5
  min_edge: 0.02
  # Resting YES limits: bid 1–2¢ only; no step-up tier (high_conf disabled).
  preferred_limit: 0.01
  fallback_limit: 0.02
  maker_tick: 0.01
  high_conf_max_limit: 0.02
  high_conf_min_ratio: 99
  min_dual_edge: 0.012
  strict_limit: true
  take_profit_bid: 0.95
  exit_ladder: []
  exit_model_prob: 0.02
  # Only fade on model collapse on event day; hold through forecast noise earlier.
  exit_model_prob_min_days_ahead: 0
  # Hold through resolution hour (no 1h-early time stop).
  hours_before_resolution: 0
  stop_loss_bid: 0.01
  min_sell_bid: 0.02
  min_event_volume: 200
  min_ensemble_members: 8
  position_usd: 5
  max_position_usd: 5
  max_open_positions: 10
  max_hourly_rise_f: 4.0
  high_hour_local: 20
  cities:
    [
      denver,
      chicago,
      dallas,
      phoenix,
      houston,
      austin,
      nyc,
      london,
      wellington,
      cape-town,
      munich,
      guangzhou,
      warsaw,
      karachi,
      beijing,
      wuhan,
      seoul,
      shanghai,
      tokyo,
      busan,
      chongqing,
      manila,
      vienna,
    ]

# ObieWeather ladder: 3–4 cheap YES legs; limit-price sum ≤60¢ (one win covers losses).
obieweather:
  starting_balance: 500
  min_yes_ask: 0.01
  max_yes_ask: 0.40
  min_yes_bets_per_event: 3
  max_yes_bets_per_event: 4
  max_event_usd: 10.0
  target_event_usd: 0.60
  max_ladder_price_sum: 0.60
  max_event_fraction: 0.05
  min_model_prob: 0.05
  min_ensemble_prob_sum: 0.28
  maker_tick: 0.01
  strict_limit: true
  # Paper: FAK at ask for immediate sim fills; live keeps strict LIMIT at ask-tick.
  paper_fak_at_ask: true
  min_event_volume: 100
  min_ensemble_members: 8
  max_open_positions: 40
  max_open_per_event: 4
  min_days_ahead: 0
  max_days_ahead: 2
  cities:
    [
      san-diego,
      los-angeles,
      honolulu,
      miami,
      atlanta,
      dallas,
      charleston,
      tampa,
      las-palmas,
      santa-cruz-de-tenerife,
      medellin,
      kunming,
      cape-town,
      sydney,
      buenos-aires,
      vina-del-mar,
      florianopolis,
      nice,
      nairobi,
      arequipa,
    ]

# Contrarian: fade overpriced YES longshots — buy NO via L2 walk + strict LIMIT.
# Hold toward $1; skip ultra-tight NO asks with bad risk/reward.
contrarian:
  starting_balance: 2500
  min_yes_ask: 0.02
  max_yes_ask: 0.20
  max_model_yes: 0.07
  min_edge: 0.030
  min_vig_edge: 0.005
  maker_tick: 0.01
  max_no_bets_per_event: 1
  kelly_fraction: 0.28
  max_event_fraction: 0.12
  min_event_volume: 120
  min_ensemble_members: 8
  max_position_usd: 75
  max_open_positions: 16
  max_open_per_city: 2
  # HEART: walk asks under EV (p - price), clip to Kelly, place BUY LIMIT at max level.
  strict_limit: true
  book_walk_min_ev: 0.010
  # Bayes shadow (Parlex): prior=Shin fair YES, LR from model vs prior (shrunk); log only.
  bayes_shadow: true
  bayes_lr_shrink: 0.5
  bayes_max_lr: 8.0
  bayes_fee_buffer: 0.01
  # Hold-to-resolution: only trim when NO is essentially at $1.
  take_profit_no_bid: 0.999
  # Catastrophic only; model-rally + mark drop is the early exit.
  stop_loss_no_bid: 0.40
  min_no_entry: 0.74
  # Paper losses clustered on 87¢+ NO entries (tiny upside / fat downside).
  max_no_ask: 0.86
  max_days_ahead: 2
  # Model-fade only on event day AND when P(yes) is clearly elevated (see code: needs bid drop).
  exit_model_yes: 0.35
  exit_model_prob_min_days_ahead: 0
  min_sell_bid: 0.02
  max_hourly_rise_f: 4.0
  high_hour_local: 20
  cities:
    [
      denver,
      chicago,
      dallas,
      phoenix,
      houston,
      austin,
      nyc,
      london,
      wellington,
      cape-town,
      munich,
      guangzhou,
      warsaw,
      karachi,
      beijing,
      wuhan,
      seoul,
      shanghai,
      tokyo,
      busan,
      chongqing,
      manila,
      vienna,
    ]

