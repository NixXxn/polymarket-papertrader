# $50 per isolated account. Combined paper start is 2 × this (safe + asymmetric).
# mode: paper (test/sim, default) or live. Live still needs --confirm-live or
# PAPERTRADER_LIVE=1 plus PAPERTRADER_PRIVATE_KEY. yaml alone cannot fire orders.
mode: paper
poll_interval_seconds: 30
horizon_days: 3
starting_balance: 500
# position_usd values are the stake at starting_balance; live bets scale with cash.
min_position_usd: 1
min_event_volume: 200
min_best_ask_size: 1
# Assumed model P(yes) ceiling for safe favorite buys (ask must be <= this).
forecast_confidence: 0.95
forecast_disagreement_f: 3.0
user_agent: "polymarket-papertrader/0.1 (paper trading; local use)"

safe:
  cities: [miami, atlanta, nyc, chicago, dallas, houston, austin, phoenix, denver, los-angeles]
  # Consensus matches with market agreement; FAK taker fills.
  # Paper -$786 @ 10% WR on 0.62–0.67 asks; require clearer favorites only.
  min_ask: 0.70
  max_ask: 0.75
  max_open_positions: 8
  min_sell_bid: 0.02
  # Safe-only paper bankroll override for larger test sizing.
  starting_balance: 10000
  min_edge: 0.02
  min_edge_high: 0.04
  min_edge_low: 0.01
  position_usd:
    miami: 100
    atlanta: 100
    nyc: 100
    chicago: 100
    dallas: 100
    houston: 100
    austin: 100
    phoenix: 100
    denver: 100
    los-angeles: 100

# Asymmetric: hold existing tails; no new entries (hurts win-rate / MTM).
asymmetric:
  min_ask: 0.02
  max_ask: 0.12
  min_model_prob: 0.18
  min_prob_ratio: 2.5
  min_edge: 0.08
  take_profit_bid: 0.35
  # Staged trims: small sells at each multiple; ~55% max trimmed, rest rides for 10x+.
  exit_ladder:
    - {multiple: 2, fraction: 0.10}
    - {multiple: 5, fraction: 0.10}
    - {multiple: 10, fraction: 0.15}
    - {multiple: 20, fraction: 0.15}
    - {multiple: 50, fraction: 0.10}
  exit_model_prob: 0.03
  # Only fade on model drop on event day (d+0); hold through forecast noise earlier.
  exit_model_prob_min_days_ahead: 0
  # Hard exit 1h before local 23:00 resolution (was 6h — too early).
  hours_before_resolution: 1
  stop_loss_bid: 0.01
  min_sell_bid: 0.02
  min_event_volume: 200
  min_ensemble_members: 8
  position_usd: 2
  max_position_usd: 25
  max_open_positions: 0
  max_hourly_rise_f: 4.0
  high_hour_local: 20
  cities:
    [
      denver,
      chicago,
      dallas,
      phoenix,
      houston,
      austin,
      nyc,
      london,
      wellington,
      cape-town,
      munich,
      guangzhou,
      warsaw,
      karachi,
      beijing,
      wuhan,
      seoul,
      shanghai,
      tokyo,
      busan,
      chongqing,
      manila,
    ]

# Contrarian: fade overpriced YES longshots — buy NO via L2 walk + strict LIMIT.
# Hold toward $1; skip ultra-tight NO asks with bad risk/reward.
contrarian:
  min_yes_ask: 0.02
  max_yes_ask: 0.20
  max_model_yes: 0.07
  min_edge: 0.030
  min_vig_edge: 0.005
  maker_tick: 0.01
  max_no_bets_per_event: 1
  kelly_fraction: 0.22
  max_event_fraction: 0.09
  min_event_volume: 120
  min_ensemble_members: 8
  max_position_usd: 32
  max_open_positions: 14
  max_open_per_city: 2
  # HEART: walk asks under EV (p - price), clip to Kelly, place BUY LIMIT at max level.
  strict_limit: true
  book_walk_min_ev: 0.010
  # Hold-to-resolution bias: only trim when NO is essentially done.
  take_profit_no_bid: 0.985
  # Catastrophic only; model-rally + mark drop is the early exit.
  stop_loss_no_bid: 0.40
  min_no_entry: 0.74
  # Paper losses clustered on 87¢+ NO entries (tiny upside / fat downside).
  max_no_ask: 0.86
  max_days_ahead: 2
  # Model-fade only on event day AND when P(yes) is clearly elevated (see code: needs bid drop).
  exit_model_yes: 0.35
  exit_model_prob_min_days_ahead: 0
  min_sell_bid: 0.02
  max_hourly_rise_f: 4.0
  high_hour_local: 20
  cities:
    [
      denver,
      chicago,
      dallas,
      phoenix,
      houston,
      austin,
      nyc,
      london,
      wellington,
      cape-town,
      munich,
      guangzhou,
      warsaw,
      karachi,
      beijing,
      wuhan,
      seoul,
      shanghai,
      tokyo,
      busan,
      chongqing,
      manila,
      vienna,
    ]

copy:
  wallet: "0x09b045baad1fbe115c70785635a261411774a3b6"
  scale: 0.05
  poll_interval_ms: 250
  recent_limit: 50

# Esports: CS2 + LoL only, OddsPapi fair-value required (no cheap-swing fallback).
esports:
  horizon_hours: 8
  poll_interval_seconds: 45
  min_ask: 0.05
  max_ask: 0.55
  take_profit_pct: 0.14
  stop_loss_entry_pct: 0.55
  position_usd: 6
  max_position_usd: 25
  max_open_positions: 10
  min_event_volume: 80
  search_queries:
    [
      cs2,
      counter-strike,
      lol,
      league-of-legends,
      lck,
      lpl,
      lec,
      lcs,
    ]
  event_tags:
    [
      league-of-legends,
      counter-strike,
      cs2,
      esports,
    ]
  search_limit: 60
  tag_slug: esports
  exclude_slug_patterns:
    [
      "-spread-",
      "-total-",
      "-o-u-",
      "player-props",
      "more-markets",
      "-handicap-",
      "-first-half-",
      "-1h-",
      "-map-",
      "-kill-",
      "-first-blood-",
      "dota",
      "valorant",
      "vct-",
    ]
  # OddsPapi fair-value only (ODDSP_API_KEY in .env). CS2 + LoL.
  oddspapi:
    enabled: true
    min_edge: 0.10
    primary_bookmaker: bet365
    fallback_bookmakers: [unibet, stake, pinnacle]
    sport_ids: [17, 18] # CS2, LoL
    max_daily_requests: 20
    max_monthly_requests: 245
    refresh_interval_hours: 3
    kelly_fraction: 0.20
    maker_edge_cents: 0.01
    require_match: true
    max_tournaments_per_sport: 10
    base_url: "https://api.oddspapi.io/v4"

# Weather momentum: high WR favorites — buy >= 80¢, TP 98¢, wider SL to avoid noise stops.
momentum:
  ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  use_websocket: true
  poll_interval_seconds: 5
  mode: ANY_BUCKET
  specific_token_id: ""
  entry_trigger_price: 0.86
  take_profit_price: 0.98
  stop_loss_price: 0.70
  order_size_shares: 25.0
  use_share_sizing: true
  position_usd: 40
  max_position_usd: 80
  max_open_positions: 5
  min_event_volume: 200
  entry_price_buffer: 0.01
  exit_slippage_buffer: 0.01
  cities: [nyc, miami, atlanta, chicago, dallas, houston]

# Mean reversion: fade Yes/No price excursions (FAK).
meanrev:
  min_liquidity: 2500
  price_min: 0.10
  price_max: 0.88
  rolling_window: 36
  min_z_score: 1.60
  min_edge: 0.030
  min_confidence: 0.55
  kelly_fraction: 0.15
  max_position_usd: 30
  max_open_positions: 4
  position_usd: 15
  stop_loss_pct: 0.18
  take_profit_pct: 0.10

# Volume/activity spike: follow inter-poll price bursts on liquid Yes/No markets.
volspike:
  min_liquidity: 2000
  price_min: 0.10
  price_max: 0.88
  volume_history_len: 24
  spike_threshold: 1.55
  min_edge: 0.022
  min_confidence: 0.50
  kelly_fraction: 0.15
  max_position_usd: 30
  max_open_positions: 4
  position_usd: 12
  stop_loss_pct: 0.20
  take_profit_pct: 0.10

# Closing soon: stricter favorites only (FAK taker at live CLOB ask). Hold to $1.
closingsoon:
  min_liquidity: 2000
  # Prefer enough time OR very high ask (see code hours/ask discipline).
  min_hours: 3
  max_hours: 30
  price_min: 0.940
  price_max: 0.975
  min_direction: 0.40
  min_edge: 0.012
  min_confidence: 0.60
  kelly_fraction: 0.22
  max_position_usd: 35
  max_open_positions: 8
  position_usd: 18
  stop_loss_pct: 0.40

# BTC 5m Up/Down scalper: spot-vs-open confirmation, FAK taker (wider window for paper flow).
btc5m:
  min_confirm_bps: 8.0
  min_entry_seconds_left: 10
  max_entry_seconds_left: 140
  min_ask: 0.55
  max_ask: 0.85
  min_edge: 0.030
  min_liquidity: 300
  look_ahead_windows: 2
  position_usd: 20
  max_position_usd: 40
  max_open_positions: 2
  stop_loss_pct: 0.40

# World-intel style overlays (macro Fear&Greed + BTC SMAs + event taxonomy).
# Free APIs only — inspired by marc-shade/world-intel-mcp domains, no MCP on hot path.
intel:
  enabled: true
  shadow_only: false
  ttl_seconds: 900
  fail_open_on_error: true
  # Steady-profit bias: block sports/elections/longshots; size-down in CAUTION.
  block_event_score: 65
  caution_size_mult: 0.40
  btc_min_fear_greed: 45
  strategies: [meanrev, volspike, closingsoon, btc5m]

live:
  clob_host: "https://clob.polymarket.com"
  chain_id: 137
  # 0 = EOA private key, 1 = email/Magic proxy, 2 = Gnosis safe
  signature_type: 1
  funder: ""
