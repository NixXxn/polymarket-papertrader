# $50 per isolated account. Combined paper start is 2 × this (safe + asymmetric).
# mode: paper (test/sim, default) or live. Live still needs --confirm-live or
# PAPERTRADER_LIVE=1 plus PAPERTRADER_PRIVATE_KEY. yaml alone cannot fire orders.
mode: paper
poll_interval_seconds: 180
horizon_days: 3
starting_balance: 500
# position_usd values are the stake at starting_balance; live bets scale with cash.
min_position_usd: 1
min_event_volume: 200
min_best_ask_size: 1
forecast_confidence: 0.80
forecast_disagreement_f: 3.0
user_agent: "polymarket-papertrader/0.1 (paper trading; local use)"

safe:
  cities: [miami, atlanta]
  max_ask: 0.60
  max_open_positions: 50
  min_sell_bid: 0.02
  min_edge: 0.15
  min_edge_high: 0.25
  min_edge_low: 0.10
  position_usd:
    miami: 5
    atlanta: 4

# Strategy 1: asymmetric tail-risk arb (cheap YES, ensemble >> market, hedge ~35¢).
asymmetric:
  min_ask: 0.02
  max_ask: 0.10
  min_model_prob: 0.20
  min_prob_ratio: 3.0
  min_edge: 0.10
  take_profit_bid: 0.35
  # Staged trims: small sells at each multiple; ~55% max trimmed, rest rides for 10x+.
  exit_ladder:
    - {multiple: 2, fraction: 0.10}
    - {multiple: 5, fraction: 0.10}
    - {multiple: 10, fraction: 0.15}
    - {multiple: 20, fraction: 0.15}
    - {multiple: 50, fraction: 0.10}
  exit_model_prob: 0.08
  stop_loss_bid: 0.01
  min_sell_bid: 0.02
  min_event_volume: 200
  min_ensemble_members: 8
  position_usd: 1
  max_position_usd: 100
  max_open_positions: 50
  max_hourly_rise_f: 4.0
  high_hour_local: 20
  cities:
    [
      denver,
      chicago,
      dallas,
      phoenix,
      houston,
      austin,
      nyc,
      london,
      wellington,
      cape-town,
      munich,
      guangzhou,
      warsaw,
      karachi,
      beijing,
      wuhan,
      seoul,
      shanghai,
      tokyo,
      busan,
      chongqing,
      manila,
      vienna,
    ]

copy:
  wallet: "0x09b045baad1fbe115c70785635a261411774a3b6"
  scale: 0.05
  poll_interval_ms: 250
  recent_limit: 50

# Esports: cheap live match bets ending within 6h; resting sell at 2x entry.
esports:
  horizon_hours: 6
  poll_interval_seconds: 60
  min_ask: 0.02
  max_ask: 0.45
  take_profit_multiple: 2.0
  position_usd: 5
  max_position_usd: 25
  max_open_positions: 20
  min_event_volume: 500
  search_queries: [lck, lpl, lec, vct, cs2, dota2, lol]
  event_tags: [league-of-legends, valorant, dota-2, esports]
  search_limit: 40
  tag_slug: esports

live:
  clob_host: "https://clob.polymarket.com"
  chain_id: 137
  # 0 = EOA private key, 1 = email/Magic proxy, 2 = Gnosis safe
  signature_type: 1
  funder: ""
