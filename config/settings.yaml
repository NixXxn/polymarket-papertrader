  btc_min_fear_greed: 45
  strategies: [meanrev, volspike, closingsoon, btc5m]

# Adaptive Kelly: f* scaled by (1 - σ_current/σ_rolling); past bars only.
adaptive_sizing:
  enabled: true
  rolling_window: 36
  recent_window: 9
  min_observations: 8
  regime_floor: 0.0
  regime_cap: 1.0
  strategies: [asymmetric, contrarian, conviction]

