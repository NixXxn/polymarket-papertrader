# $50 per isolated account. Combined paper start is 2 × this (safe + asymmetric).
# mode: paper (test/sim, default) or live. Live still needs --confirm-live or
# PAPERTRADER_LIVE=1 plus PAPERTRADER_PRIVATE_KEY. yaml alone cannot fire orders.
mode: paper
poll_interval_seconds: 180
horizon_days: 3
starting_balance: 500
# position_usd values are the stake at starting_balance; live bets scale with cash.
min_position_usd: 1
min_event_volume: 200
min_best_ask_size: 1
forecast_confidence: 0.80
forecast_disagreement_f: 3.0
user_agent: "polymarket-papertrader/0.1 (paper trading; local use)"

safe:
  cities: [miami, atlanta]
  max_ask: 0.60
  max_open_positions: 50
  min_sell_bid: 0.02
  min_edge: 0.15
  min_edge_high: 0.25
  min_edge_low: 0.10
  position_usd:
    miami: 5
    atlanta: 4

# Strategy 1: asymmetric tail-risk arb (cheap YES, ensemble >> market, hedge ~35¢).
asymmetric:
  min_ask: 0.02
  max_ask: 0.10
  min_model_prob: 0.20
  min_prob_ratio: 3.0
  min_edge: 0.10
  take_profit_bid: 0.35
  # Staged trims: small sells at each multiple; ~55% max trimmed, rest rides for 10x+.
  exit_ladder:
    - {multiple: 2, fraction: 0.10}
    - {multiple: 5, fraction: 0.10}
    - {multiple: 10, fraction: 0.15}
    - {multiple: 20, fraction: 0.15}
    - {multiple: 50, fraction: 0.10}
  exit_model_prob: 0.03
  # Only fade on model drop on event day (d+0); hold through forecast noise earlier.
  exit_model_prob_min_days_ahead: 0
  # Hard exit 1h before local 23:00 resolution (was 6h — too early).
  hours_before_resolution: 1
  stop_loss_bid: 0.01
  min_sell_bid: 0.02
  min_event_volume: 200
  min_ensemble_members: 8
  position_usd: 1
  max_position_usd: 100
  max_open_positions: 50
  max_hourly_rise_f: 4.0
  high_hour_local: 20
  cities:
    [
      denver,
      chicago,
      dallas,
      phoenix,
      houston,
      austin,
      nyc,
      london,
      wellington,
      cape-town,
      munich,
      guangzhou,
      warsaw,
      karachi,
      beijing,
      wuhan,
      seoul,
      shanghai,
      tokyo,
      busan,
      chongqing,
      manila,
      vienna,
    ]

# Strategy 2: fade overpriced YES longshots — buy NO with Shin devig + maker limits.
contrarian:
  min_yes_ask: 0.02
  max_yes_ask: 0.20
  max_model_yes: 0.08
  min_edge: 0.06
  min_vig_edge: 0.01
  maker_tick: 0.01
  max_no_bets_per_event: 3
  kelly_fraction: 0.25
  max_event_fraction: 0.10
  min_event_volume: 200
  min_ensemble_members: 8
  max_position_usd: 25
  max_open_positions: 30
  take_profit_no_bid: 0.85
  stop_loss_no_bid: 0.35
  min_no_entry: 0.50
  exit_model_yes: 0.15
  exit_model_prob_min_days_ahead: 0
  min_sell_bid: 0.02
  max_hourly_rise_f: 4.0
  high_hour_local: 20
  cities:
    [
      denver,
      chicago,
      dallas,
      phoenix,
      houston,
      austin,
      nyc,
      london,
      wellington,
      cape-town,
      munich,
      guangzhou,
      warsaw,
      karachi,
      beijing,
      wuhan,
      seoul,
      shanghai,
      tokyo,
      busan,
      chongqing,
      manila,
      vienna,
    ]

copy:
  wallet: "0x09b045baad1fbe115c70785635a261411774a3b6"
  scale: 0.05
  poll_interval_ms: 250
  recent_limit: 50

# Esports + live sports: cheap in-play swings ending within 8h; TP +20%, SL at 80% of entry.
esports:
  horizon_hours: 8
  poll_interval_seconds: 60
  min_ask: 0.02
  max_ask: 0.45
  take_profit_pct: 0.20
  stop_loss_entry_pct: 0.80
  position_usd: 5
  max_position_usd: 25
  max_open_positions: 20
  min_event_volume: 100
  search_queries:
    [
      lck,
      lpl,
      lec,
      vct,
      cs2,
      dota2,
      lol,
      ucl,
      epl,
      mls,
      nba,
      nfl,
      nhl,
      mlb,
      atp,
      wta,
      ufc,
      soccer,
    ]
  event_tags:
    [
      league-of-legends,
      valorant,
      dota-2,
      esports,
      sports,
      soccer,
      nba,
      nfl,
      nhl,
      mlb,
      tennis,
    ]
  search_limit: 60
  tag_slug: sports
  exclude_slug_patterns:
    [
      "-spread-",
      "-total-",
      "-o-u-",
      "player-props",
      "more-markets",
      "-handicap-",
      "-first-half-",
      "-1h-",
    ]
  # OddsPapi fair-value overlay (ODDSP_API_KEY in .env). 4 sports × 2 calls = 8 req/refresh.
  oddspapi:
    enabled: true
    min_edge: 0.06
    primary_bookmaker: pinnacle
    fallback_bookmakers: [ggbet, bet365]
    sport_ids: [17, 18, 16, 61] # CS2, LoL, Dota 2, Valorant
    max_daily_requests: 8
    max_monthly_requests: 245
    refresh_interval_hours: 3
    kelly_fraction: 0.25
    maker_edge_cents: 0.02
    require_match: false
    max_tournaments_per_sport: 8
    base_url: "https://api.oddspapi.io/v4"

# Weather momentum: WebSocket/poll stream; buy YES when bucket >= 85¢, TP 98¢, SL 75¢.
momentum:
  ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  use_websocket: true
  poll_interval_seconds: 5
  mode: ANY_BUCKET
  specific_token_id: ""
  entry_trigger_price: 0.85
  take_profit_price: 0.98
  stop_loss_price: 0.75
  order_size_shares: 50.0
  use_share_sizing: true
  position_usd: 50
  max_position_usd: 100
  max_open_positions: 1
  min_event_volume: 200
  entry_price_buffer: 0.01
  exit_slippage_buffer: 0.01
  cities: [nyc, miami, atlanta]

live:
  clob_host: "https://clob.polymarket.com"
  chain_id: 137
  # 0 = EOA private key, 1 = email/Magic proxy, 2 = Gnosis safe
  signature_type: 1
  funder: ""
