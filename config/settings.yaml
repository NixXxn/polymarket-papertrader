  min_no_entry: 0.76
  max_no_ask: 0.80
  take_profit_no_bid: 0.985
  stop_loss_no_bid: 0.45
  exit_model_yes: 0.30
  cities:
    [nyc, miami, atlanta, chicago, dallas, houston, austin, phoenix, denver, london]

